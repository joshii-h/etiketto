# Builds the print server image (packaging/docker/Dockerfile) and publishes it
# to the GitHub Container Registry as ghcr.io/joshii-h/tavletta.
#
# - Tag v1.2.3: 1.2.3, 1.2 and latest (a pre-release v1.2.3-rc1 only as
#   1.2.3-rc1). The tag arrives here through the push mirror of
#   https://git.joshuahirsig.xyz/joshii/tavletta; only maintainers can push it.
# - Push to main: edge, the state of main, for trying out what comes next.
# - Pull request: amd64 is built and tested, nothing is pushed.
# - Manual run (workflow_dispatch): both platforms are built, nothing is pushed.
#
# The "check" job builds the amd64 image, runs packaging/docker/smoke-test.sh
# on it and scans it with Trivy (a release fails on fixable CRITICAL or HIGH
# findings, other runs only report them). Only then does "publish" build
# linux/amd64 and linux/arm64 (QEMU), from the layers the check cached, and
# push them with an SBOM and SLSA provenance (BuildKit), a GitHub build
# provenance attestation and a keyless cosign signature, both on the digest.
# The check job has a read-only token; write access to packages, attestations
# and the OIDC token are only in "publish", which never runs for pull requests.
#
# Actions are pinned to full commit SHAs. Forgejo also reads .github/workflows,
# hence the server_url guard on each job.

name: Container image

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/joshii-h/tavletta
  RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check the tag
        if: env.RELEASE == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?$'; then
            echo "::error::not a release tag: $TAG"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build for amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tavletta-check:${{ github.sha }}
          # a release starts from scratch: current Debian security updates
          # (apt-get upgrade in the Dockerfile) and Python packages
          no-cache: ${{ env.RELEASE == 'true' }}
          cache-from: |
            type=gha,scope=check
            type=gha,scope=publish
          cache-to: type=gha,scope=check,mode=max

      - name: Smoke test
        env:
          # a release must report the version of its tag (tavletta/__init__.py)
          EXPECT_VERSION: ${{ env.RELEASE == 'true' && github.ref_name || '' }}
          CHECK_IMAGE: tavletta-check:${{ github.sha }}
        run: |
          EXPECT_VERSION="${EXPECT_VERSION#v}" packaging/docker/smoke-test.sh "$CHECK_IMAGE"

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: tavletta-check:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          # a release stops here; main and pull requests show the findings
          exit-code: ${{ env.RELEASE == 'true' && '1' || '0' }}

  publish:
    needs: check
    if: github.server_url == 'https://github.com' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write      # push to ghcr.io with GITHUB_TOKEN
      id-token: write      # OIDC for the attestation and the keyless signature
      attestations: write  # the build provenance attestation
    env:
      PUSH: ${{ github.event_name == 'push' }}
      # the labels and annotations below also on the multi-arch index (the
      # package page on GitHub reads the description from there)
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ env.RELEASE == 'true' && !contains(github.ref_name, '-') }}
            type=edge,branch=main
          # source is the GitHub repository: ghcr.io links the package to it by
          # this label; url is the main repository on Forgejo
          labels: |
            org.opencontainers.image.title=Tavletta print server
            org.opencontainers.image.description=Tavletta's print server without a window: REST API and MCP for label printers
            org.opencontainers.image.source=https://github.com/joshii-h/tavletta
            org.opencontainers.image.url=https://git.joshuahirsig.xyz/joshii/tavletta
            org.opencontainers.image.documentation=https://tavletta.joshuahirsig.xyz
            org.opencontainers.image.licenses=AGPL-3.0-or-later AND MIT AND Apache-2.0
          annotations: |
            org.opencontainers.image.title=Tavletta print server
            org.opencontainers.image.description=Tavletta's print server without a window: REST API and MCP for label printers
            org.opencontainers.image.source=https://github.com/joshii-h/tavletta
            org.opencontainers.image.url=https://git.joshuahirsig.xyz/joshii/tavletta
            org.opencontainers.image.documentation=https://tavletta.joshuahirsig.xyz
            org.opencontainers.image.licenses=AGPL-3.0-or-later AND MIT AND Apache-2.0

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build for amd64 and arm64
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          # amd64 from what "check" just built and tested; for a release
          # arm64 is built afresh too, not from an older cache
          cache-from: |
            type=gha,scope=check
            ${{ env.RELEASE != 'true' && 'type=gha,scope=publish' || '' }}
          cache-to: type=gha,scope=publish,mode=max

      - name: Build provenance attestation
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        if: env.PUSH == 'true'

      - name: Sign the image (keyless)
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
