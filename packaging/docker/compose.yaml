# Etiketto print server with Docker Compose (docs/server.md).
#
#   openssl rand -hex 32 > token && chmod 600 token
#   docker compose -f packaging/docker/compose.yaml up -d --build
#
# Printers on the network: finding them (mDNS) needs the host's network
# and its Avahi daemon. With `network_mode: host` the port mapping is not
# used: then listen on 127.0.0.1 (command) or keep the token.
# CUPS queues of the host (also USB printers set up in CUPS) are reached at
# ipp://localhost:631 with the host's network.

services:
  etiketto:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    image: etiketto-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8790"  # only this computer; a reverse proxy adds TLS for others
    secrets:
      - etiketto_token
    command: ["--mcp", "--token-file", "/run/secrets/etiketto_token"]
    volumes:
      - ./labels:/labels  # the label files (.etiketto) and their data files
      - etiketto-data:/data  # settings.json: printer addresses, safety margin
    # mDNS discovery through the host's Avahi, CUPS of the host:
    # network_mode: host
    # volumes:
    #   - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
    # USB printers handed to the container directly (for printer backends
    # that talk USB; CUPS queues need no device):
    # devices:
    #   - /dev/usb:/dev/usb
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

secrets:
  etiketto_token:
    file: ./token

volumes:
  etiketto-data:
