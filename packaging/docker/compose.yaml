# Tavletta print server with Docker Compose: network printers (docs/server.md).
#
#   mkdir -p config labels fonts
#   cp printers.example.toml config/printers.toml   # name your printers
#   docker compose pull
#   docker run --rm --user "$(id -u)" -v ./config:/config --entrypoint tavletta \
#       ghcr.io/joshii-h/tavletta:1.1 token new shipping-pc --role print \
#       --tokens /config/tokens.toml --printers /config/printers.toml
#   docker compose up -d
#
# The image is the published one (ghcr.io/joshii-h/tavletta, amd64 and
# arm64); 1.1 follows the bug fix releases of 1.1. To build it from this
# checkout instead, add compose.build.yaml (-f compose.yaml -f compose.build.yaml).
#
# `token new` shows the token once and keeps only its hash in tokens.toml.
#
# Printers are reached by their address in printers.toml; nothing is
# searched on the network. Finding printers by mDNS, the host's CUPS and
# USB devices: add compose.host.yaml (-f compose.yaml -f compose.host.yaml).
#
# config/ is mounted as a folder, not file by file: `tavletta token new`
# replaces tokens.toml, and the server reads it again when it changes
# (a single mounted file would keep showing the old one).

services:
  tavletta:
    image: ghcr.io/joshii-h/tavletta:1.1
    restart: unless-stopped
    # the owner of config/ and labels/ on the host: the container reads
    # tokens.toml (mode 600) and saves counters into the label files as that
    # user (export TAVLETTA_UID=$(id -u) TAVLETTA_GID=$(id -g) if not 1000)
    user: "${TAVLETTA_UID:-1000}:${TAVLETTA_GID:-1000}"
    environment:
      # the time zone of {=date} and {=time} on labels, e.g. Europe/Zurich
      TZ: "${TAVLETTA_TZ:-UTC}"
    mem_limit: 1g
    pids_limit: 128
    ports:
      - "127.0.0.1:8790:8790"  # only this computer; a reverse proxy adds TLS for others
    command:
      - "--mcp"
      - "--printers"
      - "/config/printers.toml"
      - "--tokens"
      - "/config/tokens.toml"
      # behind a reverse proxy in a Docker network: its X-Forwarded-For
      # names the clients (the rate limit and the log use them). Give the
      # proxy's own address (a fixed one in the network, /32), never a whole
      # range: connections through the published port come from the Docker
      # gateway, which is in that range too, and could name any client.
      # With a proxy, publish no port at all (remove "ports:"), so the
      # server is reached only through the proxy.
      # - "--trusted-proxy"
      # - "172.30.0.10/32"
    volumes:
      # printers.toml, tokens.toml (hashes only), tavletta/settings.json if wanted
      - ./config:/config:ro
      - ./labels:/labels  # the label files (.tavletta) and their data files
      # fonts of your own (.ttf, .otf), e.g. the corporate font; read when
      # the server starts: docker compose restart after adding one
      - ./fonts:/usr/local/share/fonts:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
