# printers.toml: the printers the server prints on, by name (docs/server.md).
# Clients choose one with "printer": "<name>"; no other printer can be used.
# The models: tavletta list-printers, or GET /api/v1/printers without this file.

[printers.shipping]
backend = "cab"                      # cab EOS, SQUIX, MACH
host = "cab-shipping.example.com"    # address of the printer
description = "Shipping labels"
location = "Warehouse, gate 2"
media = "100 x 50 mm"
default = true                       # when a request names no printer
max_copies = 200

[printers.office]
backend = "system"                   # IPP Everywhere printer or CUPS queue
host = "ipp://office-printer.example.com/ipp/print"
description = "A4 sheets"
max_copies = 20

[printers.kitchen]
backend = "vc500w"
host = "192.0.2.50"
mode = "vivid"
cut = "full"
safe_mm = 1.5
