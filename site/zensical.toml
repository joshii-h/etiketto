# Zensical configuration, shared by all languages.
# site/build.py writes one copy per language and fills in the language,
# the site_url and the language selector; do not build this file directly.

[project]
site_name = "Tavletta"
site_description = "Design and print labels"
site_url = "https://tavletta.joshuahirsig.xyz/"
repo_url = "https://git.joshuahirsig.xyz/joshii/tavletta"
repo_name = "joshii/tavletta"
copyright = "Tavletta · AGPL-3.0-or-later · Not affiliated with any printer manufacturer"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/extra.css"]
# Page order; the titles come from each page's first heading, so they are
# translated with the page.
nav = ["index.md", "use.md", "sheets.md", "serial.md", "printer.md", "server.md", "server-install.md", "api.md", "api-guide.md", "contribute.md"]

[project.theme]
language = "en"
custom_dir = "overrides"
# no Google Fonts: system fonts, nothing loaded from third parties
font = false
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
repo = "lucide/git-branch"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
