# Publishes a release for a tag v* on Forgejo. GitHub copies it on its own
# (.github/workflows/release-mirror.yml) once the tag arrives via the mirror.
#
# Notes come from the matching <release> in the AppStream metainfo, otherwise
# from the tag annotation. Assets: sdist, wheel and SHA256SUMS. The tag must
# match __version__ in etiketto/__init__.py (pyproject.toml reads it from there).
#
# Manual run (Actions -> Release -> Run workflow): `tag` picks an existing tag;
# with `dry_run` (default) everything is built and printed, nothing published.
# A dry run without that tag builds the selected branch instead.
#
# No secrets: Forgejo uses the automatic Actions token.
# Re-runs are safe: existing releases are reused, existing assets skipped.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag, e.g. v1.0.0
        required: true
      dry_run:
        description: Dry run (build only, publish nothing)
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORGEJO_URL: https://git.joshuahirsig.xyz
  REPO_URL: https://git.joshuahirsig.xyz/${{ github.repository }}.git
  DEBIAN_FRONTEND: noninteractive
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 30
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) != 'false' }}
    steps:
      - name: Install system packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates git curl jq python3 python3-venv gettext > /dev/null

      - name: Get the code
        run: |
          set -euo pipefail
          # strict: the tag is used in URLs and API paths
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?$'; then
            echo "::error::not a release tag: $TAG"; exit 1
          fi
          git clone -q "$REPO_URL" src
          cd src
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            git checkout -q --detach "refs/tags/$TAG"
          elif [ "$DRY_RUN" = true ]; then
            echo "::warning::Tag $TAG does not exist, dry run builds ${GITHUB_SHA} instead"
            git checkout -q --detach "$GITHUB_SHA"
          else
            echo "::error::Tag $TAG does not exist"; exit 1
          fi
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --format='%h %s'

      - name: Version and release notes
        working-directory: src
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import os, pathlib, re, subprocess, sys
          import xml.etree.ElementTree as ET

          tag = os.environ["TAG"]
          init = pathlib.Path("etiketto/__init__.py").read_text()
          version = re.search(r'__version__ = "([^"]+)"', init)[1]
          if tag != f"v{version}":
              msg = f"tag {tag} does not match the version {version} in etiketto/__init__.py"
              if os.environ["DRY_RUN"] != "true":
                  sys.exit(f"::error::{msg}")
              print(f"::warning::{msg}")

          def text(el):
              return " ".join("".join(el.itertext()).split())

          notes = []
          for path in pathlib.Path("data").glob("*.metainfo.xml"):
              for rel in ET.parse(path).getroot().iterfind("releases/release"):
                  if rel.get("version") != version:
                      continue
                  desc = rel.find("description")
                  for el in desc if desc is not None else []:
                      if el.tag == "p":
                          notes.append(text(el))
                      elif el.tag in ("ul", "ol"):
                          notes.append("\n".join(f"- {text(li)}" for li in el.iterfind("li")))
          if not notes:  # fall back to the tag annotation (empty for lightweight tags)
              ann = subprocess.run(
                  ["git", "for-each-ref", f"refs/tags/{tag}", "--format=%(contents)"],
                  capture_output=True, text=True, check=True,
              ).stdout.strip()
              if ann:
                  notes.append(ann)
          body = "\n\n".join(notes) or f"Etiketto {version}"

          pathlib.Path("../release-notes.md").write_text(body + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"VERSION={version}\nTITLE=Etiketto {version}\n")
              env.write(f"PRERELEASE={'true' if '-' in tag else 'false'}\n")
          EOF
          echo "--- release notes ---"; cat ../release-notes.md

      - name: Build sdist and wheel
        working-directory: src
        run: |
          set -euo pipefail
          # setup.py compiles the translations into the wheel (share/locale)
          python3 -m venv ../buildenv
          ../buildenv/bin/pip install -q build
          ../buildenv/bin/python -m build --outdir ../dist .
          # The Flatpak bundle (Etiketto-$TAG-x86_64.flatpak) is built on GitHub
          # by .github/workflows/flatpak-bundle.yml and attached to both releases.
          cd ../dist
          sha256sum -- * > SHA256SUMS
          ls -l; cat SHA256SUMS

      - name: Publish on Forgejo
        if: env.DRY_RUN != 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="$FORGEJO_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: token $TOKEN")
          if ! release="$(curl -sS --fail "${auth[@]}" "$api/releases/tags/$TAG")"; then
            release="$(curl -sS --fail-with-body "${auth[@]}" -H "Content-Type: application/json" \
              --data "$(jq -n --arg tag "$TAG" --arg name "$TITLE" --rawfile body release-notes.md \
                --argjson pre "$PRERELEASE" '{tag_name: $tag, name: $name, body: $body, prerelease: $pre}')" \
              "$api/releases")"
          fi
          id="$(jq -r .id <<<"$release")"
          for f in dist/*; do
            name="$(basename "$f")"
            if jq -e --arg n "$name" 'any(.assets[]?; .name == $n)' <<<"$release" > /dev/null; then
              echo "$name exists"; continue
            fi
            curl -sS --fail-with-body "${auth[@]}" -F "attachment=@$f" \
              "$api/releases/$id/assets?name=$(jq -rn --arg n "$name" '$n|@uri')" > /dev/null
            echo "$name uploaded"
          done
          echo "$FORGEJO_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
