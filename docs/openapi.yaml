components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'A token of tokens.toml (tavletta token new) or the one token of --token-file. Ten
        wrong tokens from one address within a minute: 429 for a minute.'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: 'Stable, for programs: the same in every language.'
            message:
              type: string
              description: For people, in the language of Accept-Language.
      example:
        error:
          code: label_not_found
          message: 'No such label: x'
    Warning:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          examples:
          - barcode_narrow
          - font_missing
        message:
          type: string
    Health:
      type: object
      required:
      - status
      - version
      properties:
        status:
          const: ok
        version:
          type: string
      example:
        status: ok
        version: 1.1.0
    NamedPrinter:
      type: object
      description: A printer of printers.toml.
      required:
      - name
      - printer
      - host
      properties:
        name:
          type: string
          description: What requests name in 'printer'.
        printer:
          type: string
          description: Printer model id.
        model:
          type: string
          description: Printer model, for people.
        host:
          type: string
        description:
          type:
          - string
          - 'null'
        location:
          type:
          - string
          - 'null'
        media:
          type:
          - string
          - 'null'
        default:
          type: boolean
        max_copies:
          type: integer
        status:
          description: The state (as PrinterStatus), or state UNREACHABLE with an error; null with status=false.
          type:
          - object
          - 'null'
    Printer:
      type: object
      description: A printer model (without printers.toml).
      required:
      - id
      - name
      - kind
      - found
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          enum:
          - tape
          - labels
          - pages
        dpi:
          type: number
        color_model:
          enum:
          - color
          - mono
          - two-color
        tape_widths_mm:
          type: array
          items:
            type: number
        label_sizes_mm:
          type: array
          items:
            type: array
            items:
              type: number
        configured_host:
          type:
          - string
          - 'null'
        found:
          type: array
          description: Printers found on the network (--discover).
          items:
            type: object
            properties:
              name:
                type: string
              host:
                type: string
              address:
                type: string
    PrinterStatus:
      type: object
      required:
      - printer
      - host
      - state
      properties:
        printer:
          type: string
        host:
          type: string
        name:
          type: string
          description: Its name in printers.toml.
        model:
          type: string
        state:
          type: string
          examples:
          - IDLE
          - PRINTING
          - ERROR
        error:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Warning'
        dpi:
          type: number
        firmware:
          type:
          - string
          - 'null'
        modes:
          type: array
          items:
            type: string
        media:
          type: object
          description: 'What is loaded, as far as the printer tells: tape_mm, remaining_mm, total_mm,
            pitch_mm, cassette.'
    LabelFile:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          examples:
          - asset-tag.tavletta
        bytes:
          type: integer
        modified:
          type: string
          format: date-time
    Label:
      type: object
      required:
      - name
      - printer
      - elements
      properties:
        name:
          type: string
        printer:
          type: object
          description: Model id and name.
        size:
          type: object
          description: Tape, length, orientation, mm.
        elements:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              kind:
                type: string
                examples:
                - text
                - code
                - image
              name:
                type:
                - string
                - 'null'
                description: What 'set' fills in.
              text:
                type: string
              data:
                type: string
              symbology:
                type: string
              file:
                type:
                - string
                - 'null'
        variables:
          type: array
          items:
            type: string
          description: 'Variables of your own, {=lot}: filled in with ''set''.'
        builtin_variables:
          type: array
          items:
            type: string
        columns:
          type: array
          items:
            type: string
          description: 'Placeholders {Column}: the keys of data_rows.'
        data_file:
          type:
          - string
          - 'null'
        data_file_unusable:
          type: boolean
        data_sheet:
          type:
          - string
          - 'null'
        counter:
          type: object
          description: used (the label has {=counter}), next, step.
        features:
          type: array
          items:
            type: string
    PreviewRequest:
      type: object
      additionalProperties: false
      properties:
        label: &id005
          type: string
          maxLength: 1024
          description: Name of a label file in the labels folder (see GET /labels), subfolders with '/';
            '.tavletta' may be left out. Either label or label_content.
          examples:
          - asset-tag
        label_content: &id006
          type: object
          description: Or the label itself, as the JSON of a .tavletta file, checked like a file that
            is opened. Its data file is ignored (send data_rows instead), its counter never saved.
        printer: &id007
          type: string
          description: 'With printers.toml on the server: the printer''s name (default: the default printer
            the token may use, or the only one). Without it: a printer model id, if not the label''s
            own (the label is fitted as in the app).'
          examples:
          - it-cab
        set: &id008
          type: object
          maxProperties: 1000
          additionalProperties: &id004
            type:
            - string
            - number
            - 'null'
          description: Element name or variable name -> value, as --set on the command line; variables
            in a value are filled in; 'date' sets the moment {=date} and {=time} start from (ISO 8601).
            At most 1000 entries.
          examples:
          - title: Flour
            lot: A-17
        set_literal: &id009
          type: object
          maxProperties: 1000
          additionalProperties: *id004
          description: Like set, but braces in a value are text, not variables.
        counter_start: &id010
          type: integer
          minimum: 0
          maximum: 999999999999999
          description: The {=counter} of the first label; it goes up by the label's step with every label,
            copy and row.
        data_rows: &id011
          type: array
          minItems: 1
          maxItems: 100000
          items:
            type: object
            maxProperties: 1000
            additionalProperties:
              type:
              - string
              - number
              - 'null'
          description: 'Serial labels: one label per row, column name -> value; the label''s {Column}
            placeholders take the values. Numbers are taken as text, null as an empty cell. At most 100000
            rows, 1000 columns, 2000000 cells, 100000 characters a value.'
          examples:
          - - AssetNumber: '100001'
              Description: Laptop
        data_file: &id012
          type: string
          description: Or a CSV, TSV, ODS or XLSX file in the labels folder. Without data_rows and data_file,
            the label's own data file is used if it lies beside the label in the labels folder.
        sheet: &id013
          type: string
          description: Sheet of the data file, the first by default.
        row:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
          description: Data row to show, from 1.
        format:
          enum:
          - png
          - json
          default: png
          description: '''json'': width, height, warnings and the PNG in base64.'
        view:
          enum:
          - preview
          - printer
          default: preview
          description: '''printer'': the image as the printer gets it (turned, in its colours).'
    Preview:
      type: object
      required:
      - width
      - height
      - warnings
      - png
      properties:
        width:
          type: integer
        height:
          type: integer
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        png:
          type: string
          contentEncoding: base64
    PrintRequest:
      type: object
      additionalProperties: false
      properties:
        label: *id005
        label_content: *id006
        printer: *id007
        set: *id008
        set_literal: *id009
        counter_start: *id010
        data_rows: *id011
        data_file: *id012
        sheet: *id013
        host:
          type: string
          maxLength: 512
          description: 'Printer address, only without printers.toml (default: the one set in the app,
            else with --discover the only printer found). Refused (host_given) with printers.toml.'
        copies:
          type: integer
          minimum: 1
          maximum: 9999
          default: 1
          description: 'Copies of each label (each row); at most the printer''s max_copies. Copies times
            rows: at most --max-labels (10000 by default).'
        rows:
          type: string
          maxLength: 50
          description: 'The data rows to print, from 1: ''3-10'', ''5'', ''7-'' (to the last) or ''-4''.
            To print again from where a job stopped.'
          examples:
          - 14-20
        no_save_counter:
          type: boolean
          default: false
          description: Do not save the next {=counter} value into the label file.
        wait:
          type: number
          minimum: 0
          maximum: 300.0
          default: 0
          description: 'Seconds to wait for the job to finish before answering: 200 if it did, else 202.'
    Job:
      type: object
      required:
      - id
      - state
      - printed
      - total
      properties:
        id:
          type: string
          description: Random, 16 characters.
        state:
          enum:
          - queued
          - waiting
          - printing
          - done
          - failed
          - canceled
          description: 'waiting: its turn came, another job holds the label file (its counter). done,
            failed and canceled are final.'
        printer:
          type: string
          description: Printer model id.
        printer_name:
          type:
          - string
          - 'null'
          description: Its name in printers.toml.
        host:
          type: string
          description: The printer's address.
        owner:
          type:
          - string
          - 'null'
          description: Name of the token.
        label:
          type:
          - string
          - 'null'
          description: Name in the labels folder; null for label_content.
        printed:
          type: integer
          description: Labels printed so far.
        total:
          type: integer
          description: 'Labels to print: copies x rows.'
        rows_printed:
          type: integer
          description: 'Data rows printed in full: after a failure, print again with rows set to the
            next one (rows_printed + first row).'
        cancel_requested:
          type: boolean
          description: DELETE was sent.
        error:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Warning'
          description: 'Why it failed: printer_<code>, counter_not_saved, label_locked or prepare_failed.'
