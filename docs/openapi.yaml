        '415':
          description: Not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - not_json
        '421':
          description: Not a loopback Host on a loopback server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - wrong_host
        '422':
          description: The label would print wrongly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - file_problem
          - label_not_label
          - label_newer
          - label_damaged
          - label_unprintable
          - data_outside
          - data_problem
        '429':
          description: Too many wrong tokens, or too many jobs waiting (100 in all, 20 per named token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - too_many_requests
          - queue_full
        '500':
          description: An error of the server (logged)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - internal
        '501':
          description: A method HTTP knows but the server does not
        '503':
          description: 'Busy: no request slot, render slot or thread free'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintRequest'
            examples:
              one:
                summary: One asset label
                value:
                  label: asset-tag
                  printer: it-cab
                  data_rows:
                  - AssetNumber: '100001'
                    Description: Laptop
                  wait: 30
              series:
                summary: A series, one label per row
                value:
                  label: asset-tag
                  printer: it-cab
                  data_rows:
                  - AssetNumber: '100001'
                  - AssetNumber: '100002'
                  - AssetNumber: '100003'
              counter:
                summary: 20 numbers from the counter
                value:
                  label: asset-tag-counter
                  printer: it-cab
                  counter_start: 100001
                  copies: 20
                  no_save_counter: true
