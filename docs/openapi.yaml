# The OpenAPI 3.1 description of the Tavletta print server's REST API.
# Written by tools/openapi_docs.py from tavletta/server/openapi.py: do not
# edit; the running server serves the same at /api/v1/openapi.json.
openapi: 3.1.0
info:
  title: Tavletta
  version: 1.1.0
  description: 'Print labels made with Tavletta. JSON in and out. All requests but /health need ''Authorization:
    Bearer <token>'' when the server has a token. Named tokens (tokens.toml) have a role: preview (look
    only), print (also print and follow its own jobs) or admin (also all jobs); x-tavletta-role names
    the least role of each operation. Errors are {"error": {"code", "message"}}: the code is stable,
    the message in the language of Accept-Language; x-tavletta-codes lists the codes of each answer.'
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
- url: /api/v1
x-tavletta-error-codes:
- status: 400
  code: bad_request
  meaning: The request cannot be read (e.g. a body that ends early).
- status: 400
  code: not_json
  meaning: The body is no valid JSON (415 with another Content-Type).
- status: 400
  code: invalid_field
  meaning: A field has a wrong type or value; the message names it.
- status: 400
  code: unknown_field
  meaning: 'A field the request does not have (a typo): nothing is done.'
- status: 400
  code: no_label
  meaning: Give either label or label_content.
- status: 400
  code: data_conflict
  meaning: Give data_rows or data_file, not both.
- status: 400
  code: no_rows
  meaning: rows selects no data row.
- status: 400
  code: no_data
  meaning: sheet without a data file.
- status: 400
  code: no_printer
  meaning: 'Several printers and no default: name one in printer.'
- status: 400
  code: no_host
  meaning: No printer address (without printers.toml).
- status: 400
  code: host_given
  meaning: 'host with printers.toml: choose the printer by name.'
- status: 400
  code: too_many_copies
  meaning: More copies than the printer's max_copies.
- status: 401
  code: unauthorized
  meaning: Token missing, wrong, expired or revoked.
- status: 403
  code: forbidden
  meaning: The token's role is too low (e.g. preview printing).
- status: 403
  code: host_not_allowed
  meaning: The printer address is not allowed (--allow-printer).
- status: 403
  code: origin_not_allowed
  meaning: A web page of an origin not allowed (--allow-origin).
- status: 403
  code: header_required
  meaning: 'No token on the server: send X-Tavletta-Request.'
- status: 404
  code: not_found
  meaning: No such path.
- status: 404
  code: label_not_found
  meaning: No such label file in the labels folder.
- status: 404
  code: data_not_found
  meaning: No such data file in the labels folder.
- status: 404
  code: printer_not_found
  meaning: No such printer, or one the token may not use.
- status: 404
  code: job_not_found
  meaning: No such job (another token's, or older than 24 hours).
- status: 405
  code: method_not_allowed
  meaning: Not a method of this path.
- status: 408
  code: timeout
  meaning: The request took longer than 30 s to send.
- status: 409
  code: job_finished
  meaning: 'The job has finished: nothing to cancel.'
- status: 409
  code: counter_not_saved
  meaning: 'The label file is not writable: nothing was printed.'
- status: 411
  code: length_required
  meaning: No Content-Length (chunked bodies are not accepted).
- status: 413
  code: too_large
  meaning: Body over --max-body, or too many data rows, columns or cells.
- status: 413
  code: too_many_labels
  meaning: Copies times rows over --max-labels (10000 by default).
- status: 413
  code: label_too_large
  meaning: The label is too large to render (elements, text, pixels).
- status: 415
  code: not_json
  meaning: 'Send Content-Type: application/json.'
- status: 421
  code: wrong_host
  meaning: A loopback server asked for another host name.
- status: 422
  code: file_problem
  meaning: The label file cannot be opened.
- status: 422
  code: label_not_label
  meaning: The file is no Tavletta label.
- status: 422
  code: label_newer
  meaning: 'The label needs a newer Tavletta: update the server.'
- status: 422
  code: label_damaged
  meaning: The label file is damaged.
- status: 422
  code: label_unprintable
  meaning: 'It would print wrongly: a missing column, a bad code, …'
- status: 422
  code: data_outside
  meaning: The label's data file lies outside the labels folder.
- status: 422
  code: data_problem
  meaning: The data file cannot be read, or has no such sheet.
- status: 422
  code: prepare_failed
  meaning: The label cannot be prepared for the printer.
- status: 429
  code: too_many_requests
  meaning: 'Ten wrong tokens from this address: wait a minute.'
- status: 429
  code: queue_full
  meaning: 'Too many jobs waiting: retry later.'
- status: 500
  code: internal
  meaning: An error of the server; it is logged.
- status: 502
  code: printer_<code>
  meaning: The printer is unreachable or reports a problem.
- status: 503
  code: busy
  meaning: 'All request or render slots taken: retry after a moment.'
x-tavletta-job-error-codes:
- code: printer_<code>
  meaning: The printer is unreachable or reports a problem (jam, out of labels…).
- code: counter_not_saved
  meaning: Printed, but the next counter value could not be saved.
- code: label_locked
  meaning: Another print held the label file too long.
- code: prepare_failed
  meaning: The label could not be prepared for the printer.
