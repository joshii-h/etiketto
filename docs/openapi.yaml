  /print:
    post:
      summary: 'Print: the request is checked, then queued; each printer prints one job at a time'
      x-tavletta-role: print
      parameters:
      - *id001
      responses:
        '200':
          description: The job finished within 'wait'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '202':
          description: Queued or printing; follow it at Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          headers:
            Location:
              description: /api/v1/jobs/{id} of the job.
              schema:
