        in: header
        required: false
        schema:
          type: string
        description: 'Needed (any value) when the server has no token: a web page cannot send it, so
          it cannot make the server contact printers.'
      - name: discover
        in: query
        schema:
          type: boolean
          default: true
        description: 'Without printers.toml and with --discover: search.'
      - name: status
        in: query
        schema:
          type: boolean
          default: true
        description: Ask each printer of printers.toml for its state (remembered for 5 s).
      responses:
        '200':
          description: Printers
          content:
            application/json:
              schema:
                type: object
                properties:
                  printers:
                    type: array
                    items:
                      oneOf:
                      - $ref: '#/components/schemas/NamedPrinter'
                      - $ref: '#/components/schemas/Printer'
        '401':
