            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - wrong_host
        '500':
          description: An error of the server (logged)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - internal
        '501':
          description: A method HTTP knows but the server does not
        '503':
          description: 'Busy: no request slot, render slot or thread free'
