app-id: xyz.joshuahirsig.Etiketto
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: etiketto

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # raw TCP 9100 to the printer
  - --share=network
  # resolve VC-500W*.local and browse for printers via the host's Avahi daemon
  - --system-talk-name=org.freedesktop.Avahi

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'

# The runtime already ships PyGObject and pycairo. All Python packages are
# installed offline from the sources below (Flathub builds without network).
build-options:
  env:
    PIP_DISABLE_PIP_VERSION_CHECK: '1'

modules:
  # build-only: Pillow's setup.py imports pybind11.setup_helpers
  - name: python3-pybind11
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps --no-index
        pybind11-*.whl
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/33/fd/8762f7ee3e4e4be6d1d846cffb4916dd9bb02b2f800d3603718a0efe494c/pybind11-3.1.0-py3-none-any.whl
        sha256: b8488090f8acffbcb6b5d6a85571a6827a0a2981ffb75e5a0b27b87c4a6b7dd0

  - name: python3-pillow
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps --no-index
        .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/ce/a4/9cc30690a394a8305e8be4c9036aa16d0dfddadd09079860b582f562496d/pillow-13.0.0.tar.gz
        sha256: cdcd1ba258178f7356d74170c9a81ba4eab6a5d55748bc402a5a2a6fe6be3510
        x-checker-data:
          type: pypi
          name: pillow

  # pure Python
  - name: python3-segno
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps --no-index
        segno-*.whl
    cleanup:
      - /bin/segno
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/d6/02/12c73fd423eb9577b97fc1924966b929eff7074ae6b2e15dd3d30cb9e4ae/segno-1.6.6-py3-none-any.whl
        sha256: 28c7d081ed0cf935e0411293a465efd4d500704072cdb039778a2ab8736190c7
        x-checker-data:
          type: pypi
          name: segno
          packagetype: bdist_wheel

  # pure Python
  - name: python3-python-barcode
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps --no-index
        python_barcode-*.whl
    cleanup:
      - /bin/python-barcode
      # the 0.16.1 wheel also ships its docs/ and tests/ as top-level packages
      - /lib/python3*/site-packages/docs
      - /lib/python3*/site-packages/tests
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b2/34/810885dca784b02e5ad0f71ced9c06ba5e9d33a6493bc886f7470ce82a39/python_barcode-0.16.1-py3-none-any.whl
        sha256: 5776567478c9a0dae473374bb86631ba0b5ea99aaf302763b364e367ac51f367
        x-checker-data:
          type: pypi
          name: python-barcode
          packagetype: bdist_wheel

  # all symbologies but QR, Code 128 and EAN-13: libzint 2.15.0 (BSD-3-Clause)
  # in its Python binding (Apache-2.0). One extension module, no other
  # dependencies; the wheel's Python tag must match the runtime's Python
  # (GNOME 51: 3.14). Zint's BSD notice goes along with the binary.
  - name: python3-zint-bindings
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps --no-index
        zint_bindings-*.whl
      - install -Dm644 LICENSE.zint ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/zint/LICENSE
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/24/83/e46b9270e30645f2de42d8d144c55010572f6e2823306bfcf889698f70f8/zint_bindings-1.2.2-cp314-cp314-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: eca28846dfac9222a0da8c8c1e1119575ac1080ad8921f61f519d5b85f1be38c
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/84/d7/ad16bb204293f62bc75f5bdb72fb9988493c54d1a1bda4109b6f65cc689a/zint_bindings-1.2.2-cp314-cp314-manylinux2014_aarch64.manylinux_2_17_aarch64.whl
        sha256: b96f64fa77bc04289986919b5f7d09e747ddf1d1bb5eb5401e6c350b14e062d0
      - type: file
        path: LICENSE.zint

  # native VC-500W protocol; fork until sgrimee/labelprinter-vc500w#1-#3 are merged
  - name: python3-labelprinter
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps --no-index
        .
    cleanup:
      # CLI tools and the CUPS backend are not used by the app
      - /bin/label-*
      - /bin/vc500w-cups-backend
    sources:
      - type: git
        url: https://github.com/joshii-h/labelprinter-vc500w.git
        commit: a6f2957de323f71f364b3acd6624da8b9885587a

  - name: etiketto
    buildsystem: simple
    build-commands:
      # setup.py also installs desktop file, metainfo, icons, MIME type and translations
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps --no-index
        .
    sources:
      # local checkout, for development builds
      - type: dir
        path: ../..
        skip:
          - .git
          - .venv
          - .flatpak-builder
          - build-dir
          - repo
          - etiketto/locale
          - build
      # for Flathub, replace the dir source with the release tag:
      # - type: git
      #   url: https://git.joshuahirsig.xyz/joshii/etiketto.git
      #   tag: v1.0.0
      #   commit: <commit of v1.0.0>
      #   x-checker-data:
      #     type: git
      #     tag-pattern: ^v([\d.]+)$
