<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The tests' font configuration (tests/conftest.py sets FONTCONFIG_FILE): the
  system's, but the generic families are DejaVu, which the CI installs
  (fonts-dejavu-core) and most desktops have. Without this "Sans" is whatever
  the computer (or its user's ~/.config/fontconfig) prefers, and text widths,
  code sizes and warnings differ from computer to computer.
  These rules come before the system's, so they see the family asked for.
-->
<fontconfig>
  <match target="pattern">
    <test qual="first" name="family"><string>sans</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>mono</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
</fontconfig>
