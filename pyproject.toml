[build-system]
requires = ["setuptools>=77", "wheel"]  # PEP 639 license field
build-backend = "setuptools.build_meta"

[project]
name = "etiketto"
version = "0.1.0"
description = "Label designer for the Brother VC-500W colour label printer (GTK4/libadwaita)"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "segno>=1.6",
    "python-barcode>=0.15",
    # native VC-500W protocol; fork until sgrimee/labelprinter-vc500w#1-#3 are merged
    "labelprinter @ git+https://github.com/joshii-h/labelprinter-vc500w.git@a6f2957de323f71f364b3acd6624da8b9885587a",
]
# PyGObject (GTK 4, libadwaita, Pango) and pycairo come from the system,
# install with a venv that has --system-site-packages (see install.sh).

[project.scripts]
etiketto = "etiketto.app:main"

[tool.setuptools.packages.find]
include = ["etiketto*"]

[tool.setuptools.package-data]
etiketto = ["locale/*/LC_MESSAGES/*.mo"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# %-formatting stays: gettext strings use named %(...)s placeholders
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]  # ruff format handles line length

[tool.mypy]
files = ["etiketto"]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# no type information available (PyGObject, the VC-500W fork, python-barcode)
module = ["gi", "gi.*", "labelprinter.*", "barcode", "barcode.*", "segno", "segno.*"]
ignore_missing_imports = true

# Known findings as of 2026-11-05, to be fixed, then remove these overrides:
# - model.py:127 frozenset() default for a set[str] parameter
# - app.py: `return self._fill_templates()` & co. return None-returning calls
#   (func-returns-value); `self._rendered = None` without an Optional
#   annotation, so later attribute access is flagged (assignment, attr-defined)
[[tool.mypy.overrides]]
module = "etiketto.model"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "etiketto.app"
disable_error_code = ["assignment", "attr-defined", "func-returns-value"]

[tool.bandit]
exclude_dirs = ["tests"]
