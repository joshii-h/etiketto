[build-system]
requires = ["setuptools>=77", "wheel"]  # PEP 639 license field
build-backend = "setuptools.build_meta"

[project]
name = "tavletta"
dynamic = ["version"]  # tavletta.__version__
description = "Design and print labels on label printers (GTK4/libadwaita)"
readme = "README.md"
# the label sheets (tavletta/sheets/templates.json) come from gLabels, MIT;
# the symbols (tavletta/symbols/mdi.json.gz) from Material Design Icons, Apache-2.0;
# the shipping label detection (tavletta/shipping/detect.py) follows ThermalPrint, MIT
# (all of it: THIRD_PARTY_NOTICES.md)
license = "AGPL-3.0-or-later AND MIT AND Apache-2.0"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    # who Tavletta builds on (the credits once in the README, the long description)
    "CREDITS.md",
    "tavletta/sheets/LICENSE.glabels",
    "tavletta/symbols/LICENSE.mdi",
]
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "segno>=1.6",
    "python-barcode>=0.15",
    # every other symbology: libzint (BSD-3-Clause) with its Python binding (Apache-2.0)
    "zint-bindings>=1.2.2",
    # native VC-500W protocol; fork until sgrimee/labelprinter-vc500w#1-#3 are merged
    "labelprinter @ git+https://github.com/joshii-h/labelprinter-vc500w.git@a6f2957de323f71f364b3acd6624da8b9885587a",
]
# PyGObject (GTK 4, libadwaita, Pango) and pycairo come from the system,
# install with a venv that has --system-site-packages (see install.sh).

[project.scripts]
tavletta = "tavletta.launch:main"

[tool.setuptools.packages.find]
include = ["tavletta*"]

[tool.setuptools.package-data]
# label sheets from gLabels, with their MIT license
"tavletta.sheets" = ["templates.json", "LICENSE.glabels"]
# symbols from Material Design Icons, with their Apache-2.0 license
"tavletta.symbols" = ["mdi.json.gz", "LICENSE.mdi"]

[tool.setuptools.dynamic]
version = {attr = "tavletta.__version__"}

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "zxing-cpp>=2.2",  # reads the codes back in the tests
    # tools/check.sh and the CI's quality job
    "mypy>=1.10",
    "bandit>=1.7",
    "radon>=6",
    "xenon>=0.9",
    "pip-audit>=2.7",
    "pyyaml>=6",  # tests/test_packaging.py reads the Flatpak manifest
    # tests/test_icons.py runs setup.py itself; a venv of Python 3.12 or newer
    # has no setuptools of its own (pip builds in an isolated environment)
    "setuptools>=77",
]

[tool.ruff]
line-length = 99  # PEP 8 allows up to 99 for a team that agrees on it

[tool.ruff.lint]
# PEP 8 and its idioms: naming (N), modern syntax (UP), simpler code (SIM,
# C4, PIE, RET, PERF) on top of the pycodestyle, pyflakes and bugbear rules
select = ["E", "F", "W", "B", "I", "N", "UP", "SIM", "C4", "PIE", "RET", "PERF"]
ignore = [
    "E501",  # ruff format handles line length; long translatable strings stay whole
    "UP031",  # %-formatting stays: gettext strings use named %(...)s placeholders
    "N818",  # PrinterError subclasses are the plugin API, named after the problem
]

[tool.ruff.lint.per-file-ignores]
"tests/test_mdns.py" = ["N802"]  # the fake bus answers D-Bus methods by their names

[tool.mypy]
files = ["tavletta"]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true  # also the bodies of functions without annotations

[[tool.mypy.overrides]]
# no type information available (PyGObject, the VC-500W fork, python-barcode)
module = ["gi", "gi.*", "labelprinter.*", "barcode", "segno", "segno.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
# test the checkout, not an installed (editable) copy
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gui: needs a display (GTK window in the test process); skipped without one",
    "real_ipp: uses the real ipp.send (a fake printer on 127.0.0.1 or a fake connection)",
]
filterwarnings = [
    # PyGObject's asyncio integration on Python 3.14, not our code
    "ignore:.*EventLoopPolicy.*:DeprecationWarning:gi.events",
    "ignore:.*get_event_loop_policy.*:DeprecationWarning:gi.events",
]

[tool.coverage.run]
source = ["tavletta"]

[tool.coverage.report]
fail_under = 90
show_missing = true
