[build-system]
requires = ["setuptools>=77", "wheel"]  # PEP 639 license field
build-backend = "setuptools.build_meta"

[project]
name = "etiketto"
dynamic = ["version"]  # etiketto.__version__
description = "Design and print labels on label printers (GTK4/libadwaita)"
readme = "README.md"
# the label sheets (etiketto/sheets/templates.json) come from gLabels, MIT
license = "AGPL-3.0-or-later AND MIT"
license-files = ["LICENSE", "etiketto/sheets/LICENSE.glabels"]
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "segno>=1.6",
    "python-barcode>=0.15",
    # native VC-500W protocol; fork until sgrimee/labelprinter-vc500w#1-#3 are merged
    "labelprinter @ git+https://github.com/joshii-h/labelprinter-vc500w.git@a6f2957de323f71f364b3acd6624da8b9885587a",
]
# PyGObject (GTK 4, libadwaita, Pango) and pycairo come from the system,
# install with a venv that has --system-site-packages (see install.sh).

[project.scripts]
etiketto = "etiketto.app:main"

[tool.setuptools.packages.find]
include = ["etiketto*"]

[tool.setuptools.package-data]
# label sheets from gLabels, with their MIT license
"etiketto.sheets" = ["templates.json", "LICENSE.glabels"]

[tool.setuptools.dynamic]
version = {attr = "etiketto.__version__"}

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6"]

[tool.ruff]
line-length = 99  # PEP 8 allows up to 99 for a team that agrees on it

[tool.ruff.lint]
# PEP 8 and its idioms: naming (N), modern syntax (UP), simpler code (SIM,
# C4, PIE, RET, PERF) on top of the pycodestyle, pyflakes and bugbear rules
select = ["E", "F", "W", "B", "I", "N", "UP", "SIM", "C4", "PIE", "RET", "PERF"]
ignore = [
    "E501",  # ruff format handles line length; long translatable strings stay whole
    "UP031",  # %-formatting stays: gettext strings use named %(...)s placeholders
    "N818",  # PrinterError subclasses are the plugin API, named after the problem
]

[tool.ruff.lint.per-file-ignores]
"tests/test_mdns.py" = ["N802"]  # the fake bus answers D-Bus methods by their names

[tool.mypy]
files = ["etiketto"]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true  # also the bodies of functions without annotations

[[tool.mypy.overrides]]
# no type information available (PyGObject, the VC-500W fork, python-barcode)
module = ["gi", "gi.*", "labelprinter.*", "barcode", "segno", "segno.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
# test the checkout, not an installed (editable) copy
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gui: needs a display (GTK window in the test process); skipped without one",
    "real_ipp: uses the real ipp.send (a fake printer on 127.0.0.1 or a fake connection)",
]
filterwarnings = [
    # PyGObject's asyncio integration on Python 3.14, not our code
    "ignore:.*EventLoopPolicy.*:DeprecationWarning:gi.events",
    "ignore:.*get_event_loop_policy.*:DeprecationWarning:gi.events",
]

[tool.coverage.run]
source = ["etiketto"]

[tool.coverage.report]
fail_under = 90
show_missing = true
