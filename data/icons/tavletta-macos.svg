<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Tavletta for macOS (Big Sur style): the tablet on an 824 x 824 plate
       (rounded square with continuous corners) centred in 1024 x 1024.
       The soft shadows are layered shapes with low opacity, not SVG
       filters, so QtSvg and other SVG Tiny 1.2 renderers draw them too.
       The tablet is the main icon (data/xyz.joshuahirsig.Tavletta.svg),
       scaled; keep both in step. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="20" x2="0" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c09068"/>
      <stop offset="1" stop-color="#b5835a"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="30" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1827"/>
      <stop offset="1" stop-color="#2c2738"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
  </defs>
